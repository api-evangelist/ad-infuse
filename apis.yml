aid: ad-infuse
name: Ad Infuse
description: Ad Infuse was a San Francisco mobile advertising technology company, founded in 2005, that
  dynamically inserted targeted mobile ads at the moment of content delivery using carrier subscriber
  demographic and behavioral data, selling to operators and brands including Orange, France Telecom and
  Procter & Gamble. It raised roughly $18M in venture funding and was acquired by mobile marketing firm
  Velti in May 2009; Velti itself collapsed in 2013 and sold its US, UK and India mobile marketing businesses
  to affiliates of Blackstone's GSO Capital Partners. The company is recorded as closed, no successor
  developer program carries the Ad Infuse brand, and its adinfuse.com domain was re-registered by an unrelated
  party in 2020 and serves no content.
